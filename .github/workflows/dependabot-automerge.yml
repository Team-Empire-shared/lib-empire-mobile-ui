# Auto-merge low-risk Dependabot PRs (patch/minor) once CI is green.
# Major bumps are left for a human. `--auto` waits for required status checks,
# so a broken bump never lands.
#
# FULLY hands-off requires the org setting "Allow GitHub Actions to approve pull
# requests" (currently OFF org-wide by policy). Until then this still enables
# auto-merge — a human's 1-approval + green CI then merges it with no manual
# "merge" click. The approve step degrades gracefully if the policy blocks it.
name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (+ approve if org policy allows)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL" || echo "auto-approve blocked by org policy — a human approval is still required (enable 'Actions can approve PRs' to make this hands-off)"
          gh pr merge --auto --squash "$PR_URL"
